name: Build GEX Dashboard

on:
  schedule:
    # Every 20 minutes during US market hours (Mon-Fri, 13:30-21:00 UTC)
    # Note: GitHub's cron is "best-effort" and can be delayed by 5-30 mins.
    - cron: '*/20 13-21 * * 1-5'

    # Once daily at 9 AM MYT (1 AM UTC) for evening review
    - cron: '0 1 * * 2-6'

  workflow_dispatch: # Allows you to run this manually from the Actions tab

  push:
    branches: [main] # Runs whenever you push code to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optional: speeds up builds if you have a requirements.txt

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build all dashboards
        run: python build_all.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

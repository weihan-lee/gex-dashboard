name: Build GEX Dashboard

# Scheduled runs use multiple firing times around peak hours to combat
# GitHub Actions queue delays (which can be 15-60 min at the top of every hour).
# Plus hourly fallback ensures the dashboard never goes more than ~1 hour stale
# during US market hours.

on:
  schedule:
    # === First 4 hours of US market (highest activity, want 30min resolution) ===
    # 9:30 AM ET market open — fire 3 times to overcome queue delays
    - cron: '25 13 * * 1-5'   # 9:25 AM ET
    - cron: '35 13 * * 1-5'   # 9:35 AM ET
    - cron: '45 13 * * 1-5'   # 9:45 AM ET

    # 10:00 AM ET — 2 firings
    - cron: '55 13 * * 1-5'   # 9:55 AM ET
    - cron: '5 14 * * 1-5'    # 10:05 AM ET

    # 10:30 AM ET
    - cron: '25 14 * * 1-5'   # 10:25 AM ET
    - cron: '35 14 * * 1-5'   # 10:35 AM ET

    # 11:00 AM ET
    - cron: '55 14 * * 1-5'   # 10:55 AM ET
    - cron: '5 15 * * 1-5'    # 11:05 AM ET

    # 11:30 AM ET
    - cron: '25 15 * * 1-5'   # 11:25 AM ET
    - cron: '35 15 * * 1-5'   # 11:35 AM ET

    # 12:00 PM ET
    - cron: '55 15 * * 1-5'   # 11:55 AM ET
    - cron: '5 16 * * 1-5'    # 12:05 PM ET

    # 12:30 PM ET
    - cron: '25 16 * * 1-5'   # 12:25 PM ET
    - cron: '35 16 * * 1-5'   # 12:35 PM ET

    # 1:00 PM ET
    - cron: '55 16 * * 1-5'   # 12:55 PM ET
    - cron: '5 17 * * 1-5'    # 1:05 PM ET

    # 1:30 PM ET
    - cron: '25 17 * * 1-5'   # 1:25 PM ET
    - cron: '35 17 * * 1-5'   # 1:35 PM ET

    # === Rest of market — every hour ===
    - cron: '25 18 * * 1-5'   # 2:25 PM ET
    - cron: '35 18 * * 1-5'   # 2:35 PM ET
    - cron: '25 19 * * 1-5'   # 3:25 PM ET
    - cron: '35 19 * * 1-5'   # 3:35 PM ET

    # === Market close ===
    - cron: '55 19 * * 1-5'   # 3:55 PM ET (5 min before close)
    - cron: '5 20 * * 1-5'    # 4:05 PM ET (5 min after close)

    # === Post-close EOD update (CBOE finalizes ~5 PM ET) ===
    - cron: '5 21 * * 1-5'    # 5:05 PM ET
    - cron: '15 21 * * 1-5'   # 5:15 PM ET

    # === MYT morning review (9 AM MYT = 1 AM UTC next day) ===
    - cron: '0 1 * * 2-6'     # 9:00 AM MYT
    - cron: '15 1 * * 2-6'    # 9:15 AM MYT (fallback)

  # Allow manual trigger anytime
  workflow_dispatch:

  # Rebuild on push to main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid wasted runs: if multiple cron jobs fire close together,
# only the latest one deploys. Earlier ones get cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build all dashboards
        run: python build_all.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build GEX Dashboard

on:
  # Run on a schedule (all times in UTC)
  # US market: 13:30-20:00 UTC (9:30 AM - 4:00 PM ET, EDT)
  # First 4 hours of market: 13:30-17:30 UTC (9:30 AM - 1:30 PM ET) → every 30 min
  # Rest of market hours: 18:00-20:00 UTC (2:00 PM - 4:00 PM ET) → every hour
  # Outside market hours: every hour during a few key windows
  schedule:
    # First 4 hours of US market — every 30 min
    - cron: '30 13 * * 1-5'   # 9:30 AM ET (open)
    - cron: '0 14 * * 1-5'    # 10:00 AM ET
    - cron: '30 14 * * 1-5'   # 10:30 AM ET
    - cron: '0 15 * * 1-5'    # 11:00 AM ET
    - cron: '30 15 * * 1-5'   # 11:30 AM ET
    - cron: '0 16 * * 1-5'    # 12:00 PM ET
    - cron: '30 16 * * 1-5'   # 12:30 PM ET
    - cron: '0 17 * * 1-5'    # 1:00 PM ET
    - cron: '30 17 * * 1-5'   # 1:30 PM ET (end of first 4hrs)

    # Rest of US market — every hour
    - cron: '30 18 * * 1-5'   # 2:30 PM ET
    - cron: '30 19 * * 1-5'   # 3:30 PM ET
    - cron: '0 20 * * 1-5'    # 4:00 PM ET (close)
    - cron: '0 21 * * 1-5'    # 5:00 PM ET (post-close, after CBOE EOD update)

    # Evening review for MYT user (9:00 AM MYT next day)
    - cron: '0 1 * * 2-6'

  # Allow manual trigger anytime
  workflow_dispatch:

  # Rebuild on push to main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build all dashboards
        run: python build_all.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

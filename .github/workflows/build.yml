name: Build GEX Dashboard

on:
  schedule:
    # Every 30 minutes during US market hours (Mon-Fri, 13:30-21:00 UTC)
    # Note: GitHub's cron is best-effort; expect 5-30 min delays at peak times.
    # Fewer cron entries = more reliable triggering.
    - cron: '*/30 13-21 * * 1-5'

    # Once daily at 9 AM MYT (1 AM UTC) for evening review
    - cron: '0 1 * * 2-6'

  workflow_dispatch:

  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build all dashboards
        run: python build_all.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
